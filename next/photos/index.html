                <div id="trashPane" hidden></div>
                <div id="sharesPane" hidden></div>
            </div>
        </div>
        <button class="photos-top-btn" id="scrollTopBtn" type="button" aria-label="เลื่อนขึ้นบนสุด" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>
        <!-- data-tab-bar / data-tab-item: the sliding red indicator from /nav-motion.js. data-tab-href makes
             the tab slide its indicator first, then load that page. -->
        <nav class="tabbar" id="tabbar" aria-label="มุมมอง" data-tab-bar>
            <button type="button" data-tab="albums" data-tab-item class="active" aria-current="page"><i class="fas fa-folder"></i><span>อัลบั้ม</span></button>
            <button type="button" data-tab="photos" data-tab-item data-tab-href="/photos/album/?view=all"><i class="fas fa-images"></i><span>รูปภาพ</span></button>
        </nav>
    </div>

    <!-- Custom Modal Overlay (z-index 99999) -->
    <div class="custom-modal-overlay" id="customModalOverlay" style="display:none;">
        <div class="custom-modal-box" id="customModalBox">
            <div class="custom-modal-icon" id="cmIcon"><i class="fas fa-circle-question"></i></div>
            <h3 id="cmTitle"></h3>
            <p id="cmMessage"></p>
            <div id="cmInputContainer" style="display:none; margin: 14px 0 6px;">
                <input type="text" id="cmInput" class="custom-modal-input" autocomplete="off">
            </div>
            <div class="custom-modal-actions" id="cmActions">
                <button class="btn-modal btn-cancel" id="cmCancelBtn" onclick="closeCustomModal()">ยกเลิก</button>
                <button class="btn-modal btn-confirm" id="cmConfirmBtn">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div class="toilet-toast" id="toast"></div>

    <script>
        const CACHE_KEY = 'photos_albums_cache_v2';
        const $ = id => document.getElementById(id);
        let authToken = '';
        let allAlbums = [];
        let lastBody = null;
        let etag = null;
        let hasData = false;
        let loadInFlight = null;
        let isInitialLoad = true;
        const loadedThumbs = new Set();

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmt = n => Number(n || 0).toLocaleString('th-TH');
        // A thumbnail that fails to load shows the tile's grey placeholder instead of a broken-image icon.
        document.addEventListener('error', e => {
            const el = e.target;
            if (el && el.tagName === 'IMG' && /\/api\/image\/[^/]+\/thumb/.test(el.getAttribute('src') || '')) el.style.visibility = 'hidden';
        }, true);

        let toastTimeout = null;
        function showToast(msg, type, sticky = false) {
            const t = $('toast');
            t.innerHTML = msg;
            t.className = 'toilet-toast ' + (type || '') + ' show';
            if (toastTimeout) clearTimeout(toastTimeout);
            if (!sticky) toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ===== Custom Modal System =====
        let customModalResolve = null;

        function showCustomPrompt({ title, message, defaultValue = '', placeholder = '', confirmText = 'ตกลง', cancelText = 'ยกเลิก', isPassword = false }) {
            return new Promise((resolve) => {
                customModalResolve = resolve;
                const icon = $('cmIcon');
                icon.className = 'custom-modal-icon info';
                icon.innerHTML = isPassword ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-pen"></i>';
                $('cmTitle').textContent = title || '';
                const msgEl = $('cmMessage');
                msgEl.textContent = message || '';
                msgEl.style.display = message ? 'block' : 'none';
                $('cmInputContainer').style.display = 'block';
                const inp = $('cmInput');
                inp.type = isPassword ? 'password' : 'text';
                inp.placeholder = placeholder || '';
                inp.value = defaultValue || '';
                const cancelBtn = $('cmCancelBtn');
                cancelBtn.textContent = cancelText;
                cancelBtn.style.display = 'inline-block';
                const confBtn = $('cmConfirmBtn');
                confBtn.className = 'btn-modal btn-confirm';
                confBtn.textContent = confirmText;
                confBtn.onclick = () => {
                    const val = inp.value;
                    customModalResolve = null;
                    closeCustomModal();
                    resolve(val);
                };
                inp.onkeydown = (e) => {
                    if (e.key === 'Enter') confBtn.click();
                    else if (e.key === 'Escape') closeCustomModal();
                };
                const overlay = $('customModalOverlay');
                overlay.style.display = 'flex';
                requestAnimationFrame(() => {
                    overlay.classList.add('show');
                    setTimeout(() => { inp.focus(); if (defaultValue) inp.select(); }, 50);
                });
            });
        }

        function showCustomConfirm({ title, message, confirmText = 'ยืนยัน', cancelText = 'ย้อนกลับ', isDanger = false, icon = 'fas fa-trash-alt' }) {
            return new Promise((resolve) => {
                customModalResolve = resolve;
                const iconEl = $('cmIcon');
                iconEl.className = 'custom-modal-icon ' + (isDanger ? 'danger' : 'warning');
                iconEl.innerHTML = `<i class="${icon}"></i>`;
                $('cmTitle').textContent = title || '';
                const msgEl = $('cmMessage');
                msgEl.textContent = message || '';
                msgEl.style.display = message ? 'block' : 'none';
                $('cmInputContainer').style.display = 'none';
                const cancelBtn = $('cmCancelBtn');
                cancelBtn.textContent = cancelText;
                cancelBtn.style.display = 'inline-block';
                const confBtn = $('cmConfirmBtn');
                confBtn.className = 'btn-modal btn-confirm' + (isDanger ? ' danger' : '');
                confBtn.textContent = confirmText;
                confBtn.onclick = () => {
                    customModalResolve = null;
                    closeCustomModal();
                    resolve(true);
                };
                const overlay = $('customModalOverlay');
                overlay.style.display = 'flex';
                requestAnimationFrame(() => overlay.classList.add('show'));
            });
        }

        function closeCustomModal() {
            const overlay = $('customModalOverlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                if (!overlay.classList.contains('show')) overlay.style.display = 'none';
                if (customModalResolve) {
                    customModalResolve(null);
                    customModalResolve = null;
                }
            }, 200);
        }

        window.__photosUI = { prompt: showCustomPrompt, confirm: showCustomConfirm, toast: showToast };

        function formatShortDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
            return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
        }

        function timeAgo(ts) {
            if (!ts) return '';
            const now = Date.now();
            const diff = Math.max(0, now - ts);
            const day = 24 * 60 * 60 * 1000, month = 30 * day, year = 365 * day;
            if (diff < day) {
                const dNow = new Date(now), dThen = new Date(ts);
                if (dNow.toDateString() === dThen.toDateString()) return 'แก้ไขล่าสุด วันนี้';
                return 'แก้ไขล่าสุด 1 วันที่แล้ว';
            }
            if (diff < month) return `แก้ไขล่าสุด ${Math.max(1, Math.floor(diff / day))} วันที่แล้ว`;
            if (diff < year) return `แก้ไขล่าสุด ${Math.max(1, Math.floor(diff / month))} เดือนที่แล้ว`;
            return `แก้ไขล่าสุด ${Math.max(1, Math.floor(diff / year))} ปีที่แล้ว`;
        }

        function getCookie(name) {
            const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
            return v ? decodeURIComponent(v[2]) : null;
        }

        // ===== Auth =====
        async function doLogin() {
            const pw = $('passwordInput').value;
            try {
                const res = await fetch('/api/photos/verify', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });
                const data = await res.json();
                if (data.success) {
                    authToken = pw;
                    document.cookie = "photos_token=" + pw + "; path=/; max-age=31536000";
                    localStorage.setItem('photos_token', pw);
                    sessionStorage.setItem('photos_token', pw);
                    showApp();
                } else {
                    $('loginError').textContent = 'รหัสผ่านไม่ถูกต้อง';
                }
            } catch (e) {
                $('loginError').textContent = 'ไม่สามารถเชื่อมต่อได้';
            }
        }

        function showApp() {
            const to = new URLSearchParams(location.search).get('to');
            if (to) {
                location.href = '/photos/album/?id=' + encodeURIComponent(to) + '&_t=' + Date.now();
                return;
            }
            $('loginPage').style.display = 'none';
            $('app').style.display = 'block';
            readCache();
            readModeFromUrl();
            // The "รูปภาพ" tab lives on the album page, which already has the grid, lightbox and
            // right-click menu every photo view should behave like.
            if (currentTab === 'photos' && !currentView) { location.replace('/photos/album/?view=all'); return; }
            applyMode();
            loadAlbums(false);
        }

        // ===== Data: render cached list instantly, then revalidate with the server (ETag) =====
        function readCache() {
            try {
                const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (c && c.body) {
                    allAlbums = JSON.parse(c.body);
                    lastBody = c.body;
                    etag = c.etag || null;
                    hasData = true;
                }
            } catch (e) {}
        }

        function writeCache() {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ etag, body: lastBody, at: Date.now() })); } catch (e) {}
        }

        function loadAlbums(force) {
            if (loadInFlight) return force ? loadInFlight.then(() => loadAlbums(true)) : loadInFlight;
            loadInFlight = (async () => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 30000);
                try {
                    const headers = {};
                    if (!force && etag && hasData) headers['If-None-Match'] = etag;
                    const res = await fetch('/api/photos/albums', { credentials: 'include', cache: 'no-store', headers, signal: ctrl.signal });
                    if (res.status === 304) return;
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const body = await res.text();
                    etag = res.headers.get('ETag');
                    if (body !== lastBody || !hasData) {
                        lastBody = body;
                        allAlbums = JSON.parse(body);
                        hasData = true;
                        render();
                    }
                    writeCache();
                } catch (e) {
                    if (!hasData) renderLoadError();
                    else if (force) showToast('อัปเดตรายการไม่สำเร็จ', 'error');
                } finally {
                    clearTimeout(timer);
                    loadInFlight = null;
                }
            })();
            return loadInFlight;
        }

        // ===== Rendering =====
        function sortList(list, sort) {
            const date = a => a.event_date || a.created_at || 0;
            return list.slice().sort((a, b) => {
                switch (sort) {
                    case 'updated_desc': return (b.updated_at || 0) - (a.updated_at || 0);
                    case 'updated_asc': return (a.updated_at || 0) - (b.updated_at || 0);
                    case 'created_desc': return (b.created_at || 0) - (a.created_at || 0);
                    case 'created_asc': return (a.created_at || 0) - (b.created_at || 0);
                    case 'count_desc': return (b.photo_count || 0) - (a.photo_count || 0) || (b.updated_at || 0) - (a.updated_at || 0);
                    case 'count_asc': return (a.photo_count || 0) - (b.photo_count || 0) || (b.updated_at || 0) - (a.updated_at || 0);
                    case 'name_asc': return a.name.localeCompare(b.name, 'th');
                    default: return date(b) - date(a) || (b.updated_at || 0) - (a.updated_at || 0);
                }
            });
        }

        function pathNames(a, byId) {
            const names = [];
            const seen = new Set();
            let cur = a.parent_id ? byId.get(a.parent_id) : null;
            while (cur && !seen.has(cur.id)) { names.unshift(cur.name); seen.add(cur.id); cur = cur.parent_id ? byId.get(cur.parent_id) : null; }
            return names;
        }

        function render() {
            const grid = $('albumGrid');
            const query = $('searchInput').value.trim().toLowerCase();
            const sort = $('sortSelect').value || 'default';
            $('searchClear').hidden = !query;
            const albums = allAlbums.filter(a => a.name && !a.name.startsWith('[DELETED] '));
            const byId = new Map(albums.map(a => [a.id, a]));
            let html = '';

            if (query) {
                const results = sortList(albums.filter(a => a.name.toLowerCase().includes(query)), sort);
                html += sectionHead('fas fa-magnifying-glass', 'ผลการค้นหา', results.length);
                html += results.length
                    ? results.map((a, i) => cardHTML(a, i, byId, true)).join('')
                    : `<div class="grid-empty">ไม่พบอัลบั้มที่ตรงกับ “${esc($('searchInput').value.trim())}”</div>`;
                renderStats(results, true);
            } else {
                // Pinned albums (from any folder level) lead the grid right after the create card, newest pin first.
                const pinned = albums.filter(a => a.pinned_at).sort((a, b) => b.pinned_at - a.pinned_at);
                const rest = sortList(albums.filter(a => !a.pinned_at && (!a.parent_id || !byId.has(a.parent_id))), sort);
                html += sectionHead('fas fa-folder', 'อัลบั้มทั้งหมด', pinned.length + rest.length);
                html += createCardHTML() +
                    pinned.map((a, i) => cardHTML(a, i + 1, byId, true)).join('') +
                    rest.map((a, i) => cardHTML(a, i + 1 + pinned.length, byId, false)).join('');
                renderStats(albums, false);
            }

            grid.innerHTML = html;
            observeCards();
            isInitialLoad = false;
            if (currentTab === 'photos' && !currentView) renderPhotoStats();
        }

        function sectionHead(icon, title, count) {
            return `<div class="grid-section"><i class="${icon}"></i><span>${title}</span><b>${fmt(count)}</b></div>`;
        }

        function renderStats(list, isSearch) {
            if (currentView || currentTab !== 'albums') return;
            let photos = 0, videos = 0;
            for (const a of list) { photos += a.photo_count || 0; videos += a.video_count || 0; }
            $('albumCountText').innerHTML =
                (isSearch ? '<span class="stat-note">ผลการค้นหา</span>' : '') +
                `<span><i class="fas fa-folder"></i>${fmt(list.length)} อัลบั้ม</span>` +
                `<span><i class="fa-regular fa-image"></i>${fmt(photos)} รูป</span>` +
                `<span><i class="fa-solid fa-video"></i>${fmt(videos)} วิดีโอ</span>`;
        }

        function animStyle(i) {
            return isInitialLoad ? `animation:toiletFadeUp .3s ease-out ${Math.min(i * 0.03, 0.4)}s both;` : '';
        }

        function createCardHTML() {
            return `
            <div id="createAlbumBtn" class="photos-album-card create-card" role="button" tabindex="0" style="${animStyle(0)}">
                <div class="photos-album-cover"><i class="fas fa-plus" style="font-size:2.2rem;color:var(--accent)"></i></div>
                <div class="photos-album-info">
                    <h3 style="color:var(--accent);margin-bottom:4px;">สร้างอัลบั้ม</h3>
                    <div class="album-meta-row"><span>เพิ่มอัลบั้มใหม่</span></div>
                </div>
            </div>`;
        }

        function coverHTML(a, name) {
            if (!a.has_access) {
                return `<div class="empty-cover" style="flex-direction:column;gap:8px;background:#374151;">
                    <i class="fas fa-lock" style="font-size:2.4rem;color:#f59e0b;"></i>
                    <span style="color:white;font-size:0.85rem;font-weight:500;opacity:0.9">Locked</span></div>`;
            }
            const covers = a.cover_images || [];
            const max = window.innerWidth <= 600 ? 1 : 3;
            const count = Math.min(covers.length, max);
            if (!count) {
                return a.child_count
                    ? '<div class="empty-cover" style="background:linear-gradient(135deg,#fdeaea,#f8d3d3);color:#b00909"><i class="fas fa-folder-tree"></i></div>'
                    : '<div class="empty-cover"><i class="fas fa-images"></i></div>';
            }
            const imgs = covers.slice(0, max).map(img => {
                const loaded = loadedThumbs.has(img.id);
                const src = loaded ? '/api/image/' + img.id + '/thumb' : (img.preview_b64 || '');
                return `<div class="cover-img-wrapper"><img src="${esc(src)}" data-id="${esc(img.id)}" alt="${name}" draggable="false" ${loaded ? 'data-loaded="1"' : 'onload="this.dataset.loaded||loadCoverThumb(this)"'}></div>`;
            }).join('');
            return `<div class="cover-collage count-${count}">${imgs}</div>`;
        }

        function cardHTML(a, i, byId, showPath) {
            const name = esc(a.name);
            const path = showPath && a.parent_id ? pathNames(a, byId) : [];
            const counts = [];
            if (a.child_count) counts.push(`<span title="โฟลเดอร์ย่อย"><i class="fas fa-folder"></i>${fmt(a.child_count)}</span>`);
            counts.push(`<span title="รูป"><i class="fa-regular fa-image"></i>${fmt(a.photo_count)}</span>`);
            if (a.video_count) counts.push(`<span title="วิดีโอ"><i class="fa-solid fa-video"></i>${fmt(a.video_count)}</span>`);
            return `
            <div id="album-${esc(a.id)}" class="photos-album-card${a.pinned_at ? ' pinned' : ''}" data-id="${esc(a.id)}" role="link" tabindex="0" style="${animStyle(i)}">
                <div class="photos-album-cover">
                    ${coverHTML(a, name)}
                    ${a.has_access ? `<div class="cover-badge-time"><i class="fa-regular fa-clock"></i> <span>${timeAgo(a.updated_at)}</span></div>` : ''}
                    <div class="cover-actions"><button class="cover-more-btn" type="button" data-more aria-label="ตัวเลือกเพิ่มเติม"><i class="fas fa-ellipsis-vertical"></i></button></div>
                </div>
                <div class="photos-album-info">
                    <h3>${a.pinned_at ? '<i class="fas fa-thumbtack pin-ico"></i>' : ''}${a.is_locked ? '<i class="fas fa-lock lock-ico"></i>' : ''}${name}</h3>
                    ${path.length ? `<div class="album-path"><i class="fas fa-folder-tree"></i>${esc(path.join(' › '))}</div>` : ''}
                    <div class="album-meta-row">
                        <div class="album-counts">${counts.join('')}</div>
                        <div class="album-date">${formatShortDate(a.event_date || a.created_at)}</div>
                    </div>
                </div>
            </div>`;
        }

        function renderLoadError() {
            $('albumGrid').innerHTML = '<div class="grid-error"><i class="fas fa-wifi" style="font-size:2rem;opacity:.4"></i><div style="margin-top:10px">โหลดอัลบั้มไม่สำเร็จ</div><button type="button" data-retry>ลองอีกครั้ง</button></div>';
            $('albumCountText').textContent = '';
        }

        let cardObs = null;
        function observeCards() {
            if (!('IntersectionObserver' in window)) return;
            if (!cardObs) {
                cardObs = new IntersectionObserver(entries => entries.forEach(e => e.target.classList.toggle('in-view', e.isIntersecting)), { rootMargin: '150px' });
            }
            cardObs.disconnect();
            document.querySelectorAll('.photos-album-card').forEach(el => cardObs.observe(el));
        }

        let coverObs = null;
        function loadCoverThumb(img) {
            if (!coverObs) {
                coverObs = new IntersectionObserver(entries => entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const el = entry.target;
                    coverObs.unobserve(el);
                    if (el.dataset.loaded || !el.dataset.id) return;
                    el.dataset.loaded = '1';
                    const id = el.dataset.id;
                    loadedThumbs.add(id);
                    const full = new Image();
                    full.onload = () => { el.src = full.src; };
                    full.src = '/api/image/' + id + '/thumb';
                }), { rootMargin: '300px' });
            }
            coverObs.observe(img);
        }

        // ===== Album covers: thumb first, medium last =====
        // Covers render at thumbnail quality so the grid appears immediately. Once the page has finished
        // loading everything else, each visible cover is re-fetched at medium quality one at a time — the
        // covers sharpen in place without competing with the first paint or the thumbnails still streaming.
        let mdEnabled = false, mdRunning = false;
        const mdQueue = [];

        function scanCoverMedium() {
            if (!mdEnabled) return;
            document.querySelectorAll('.photos-album-card.in-view .cover-img-wrapper img[data-id][data-loaded]').forEach(img => {
                if (img.dataset.md || mdQueue.includes(img)) return;
                mdQueue.push(img);
            });
            pumpCoverMedium();
        }

        function pumpCoverMedium() {
            if (mdRunning) return;
            const img = mdQueue.shift();
            if (!img) return;
            if (!img.isConnected || img.dataset.md || !img.dataset.id) return pumpCoverMedium();
            mdRunning = true;
            img.dataset.md = '1';
            const full = new Image();
            const next = () => { mdRunning = false; setTimeout(pumpCoverMedium, 120); };
            full.onload = () => { if (img.isConnected) img.src = full.src; next(); };
            full.onerror = next;
            full.src = '/api/image/' + img.dataset.id + '/medium';
        }

        function startCoverUpgrades() {
            if (mdEnabled) return;
            // A sharper cover is a nicety, never worth spending a metered or slow connection on.
            const net = navigator.connection || {};
            if (net.saveData || /^(slow-2g|2g)$/.test(net.effectiveType || '')) return;
            mdEnabled = true;
            scanCoverMedium();
            let scrollTimer = null;
            window.addEventListener('scroll', () => {
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(scanCoverMedium, 400);
            }, { passive: true });
        }

        function scheduleCoverUpgrades() {
            const kick = () => {
                const idle = window.requestIdleCallback || (fn => setTimeout(fn, 400));
                setTimeout(() => idle(startCoverUpgrades, { timeout: 4000 }), 1500);
            };
            if (document.readyState === 'complete') kick();
            else window.addEventListener('load', kick, { once: true });
        }
        scheduleCoverUpgrades();

        // ===== Interaction =====
        function openAlbum(id, newTab) {
            const url = '/photos/album/?id=' + encodeURIComponent(id);
            if (newTab) window.open(url, '_blank', 'noopener');
            else location.href = url + '&_t=' + Date.now();
        }

        const grid = $('albumGrid');
        grid.addEventListener('click', e => {
            if (e.target.closest('[data-more]')) return;
            if (window.PhotosFolders && PhotosFolders.shouldSuppressClick()) return;
            if (e.target.closest('[data-retry]')) { loadAlbums(true); return; }
            if (e.target.closest('#createAlbumBtn')) { createAlbum(); return; }
            const card = e.target.closest('.photos-album-card[data-id]');
            if (card) openAlbum(card.dataset.id, e.ctrlKey || e.metaKey);
        });
        grid.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'createAlbumBtn') { e.preventDefault(); createAlbum(); }
        });

        $('searchInput').addEventListener('input', () => { if (hasData) render(); });
        $('searchClear').addEventListener('click', () => { $('searchInput').value = ''; if (hasData) render(); $('searchInput').focus(); });
        $('sortSelect').addEventListener('change', () => { if (hasData) render(); });
        document.addEventListener('keydown', e => {
            if (e.key === '/' && currentTab === 'albums' && !currentView && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('app').offsetParent !== null) {
                e.preventDefault();
                $('searchInput').focus();
            }
        });

        function onAlbumChanged(change) {
            if (change.kind === 'dnd-move' || change.kind === 'undo') {
                lastBody = null;
                loadAlbums(true);
                return;
            }
            if (change.kind === 'delete' && window.PhotosFolders) {
                const gone = PhotosFolders.tree.descendants(allAlbums, change.id);
                allAlbums = allAlbums.filter(a => !gone.has(a.id));
            }
            lastBody = null; // whatever the server returns next replaces the optimistic state
            render();
            loadAlbums(true);
        }

        function initFolders() {
            const PF = window.PhotosFolders;
            if (!PF || initFolders.done) return;
            initFolders.done = true;
            PF.configure({ getAlbums: () => allAlbums, reload: force => loadAlbums(force) });
            PF.bindGestures(grid, {
                selector: '.photos-album-card[data-id]',
                getAlbum: id => allAlbums.find(a => a.id === id),
                onChanged: onAlbumChanged,
                onOpen: a => openAlbum(a.id)
            });
            if (PF.makeAlbumsDraggable && PF.enableDropTargets) {
                const findAlbum = id => allAlbums.find(a => a.id === id);
                PF.makeAlbumsDraggable(grid, { selector: '.photos-album-card[data-id]', getAlbum: findAlbum });
                PF.enableDropTargets(grid, {
                    selector: '.photos-album-card[data-id]',
                    targetOf: el => { const a = findAlbum(el.dataset.id); return a ? { id: a.id, name: a.name } : null; },
                    onChanged: onAlbumChanged
                });
            }
        }
        initFolders();
        window.addEventListener('photos-folders-ready', initFolders);
        document.addEventListener('DOMContentLoaded', initFolders);

        async function createAlbum() {
            const name = await showCustomPrompt({ title: 'สร้างอัลบั้มใหม่', placeholder: 'กรอกชื่ออัลบั้ม...', confirmText: 'สร้างอัลบั้ม' });
            if (!name || !name.trim()) return;
            showToast('<i class="fas fa-circle-notch fa-spin"></i> กำลังสร้างอัลบั้ม...', 'success', true);
            try {
                const res = await fetch('/api/photos/albums', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                    body: JSON.stringify({ name: name.trim() })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('สร้างอัลบั้มสำเร็จ', 'success');
                    location.href = '/photos/album/?id=' + encodeURIComponent(data.album.id) + '&_t=' + Date.now();
                } else {
                    showToast('สร้างอัลบั้มไม่สำเร็จ', 'error');
                }
            } catch (e) { showToast('เกิดข้อผิดพลาด', 'error'); }
        }

        // ===== Views: tabs (อัลบั้ม / รูปภาพ) and full-page views (ถังขยะ / ลิงก์ที่แชร์) =====
        let currentTab = 'albums';
        let currentView = null;
        const VIEW_TITLES = { trash: ['fas fa-trash-can', 'ถังขยะ'], shares: ['fas fa-link', 'ลิงก์ที่แชร์'] };

        function readModeFromUrl() {
            const p = new URLSearchParams(location.search);
            currentView = ['trash', 'shares'].includes(p.get('view')) ? p.get('view') : null;
            currentTab = p.get('tab') === 'photos' ? 'photos' : 'albums';
        }

        function writeUrl(push) {
            const p = new URLSearchParams(location.search);
            p.delete('tab');
            p.delete('view');
            if (currentTab === 'photos') p.set('tab', 'photos');
            if (currentView) p.set('view', currentView);
            const qs = p.toString();
            const url = location.pathname + (qs ? '?' + qs : '');
            if (push) history.pushState({ photosMode: true }, '', url);
            else history.replaceState(history.state, '', url);
        }

        function applyMode() {
            const inView = !!currentView;
            $('albumPane').hidden = inView || currentTab !== 'albums';
            $('photosPane').hidden = inView || currentTab !== 'photos';
            $('trashPane').hidden = currentView !== 'trash';
            $('sharesPane').hidden = currentView !== 'shares';
            $('albumToolbar').hidden = inView || currentTab !== 'albums';
            $('photosToolbar').hidden = inView || currentTab !== 'photos';
            $('tabbar').hidden = inView;
            document.documentElement.classList.toggle('has-tabbar', !inView);
            $('backBtn').hidden = !inView;
            $('trashBtn').hidden = inView;
            $('sharesBtn').hidden = inView;
            $('createBtn').hidden = inView || currentTab !== 'albums';
            document.querySelectorAll('#tabbar [data-tab]').forEach(b => {
                const on = b.dataset.tab === currentTab;
                b.classList.toggle('active', on);
                b.setAttribute('aria-current', on ? 'page' : 'false');
            });
            const [icon, title] = inView ? VIEW_TITLES[currentView] : (currentTab === 'photos' ? ['fas fa-images', 'รูปภาพทั้งหมด'] : ['fas fa-images', 'อัลบั้มรูป']);
            $('pageIcon').className = icon;
            $('pageTitle').textContent = title;
            if (currentView === 'trash') loadTrash(true);
            else if (currentView === 'shares') loadShares();
            else if (currentTab === 'photos') { renderPhotoStats(); if (!tl.started) tlStart(); }
            else if (hasData) render();
            window.scrollTo(0, 0);
        }

        document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.tab === 'photos') { location.href = '/photos/album/?view=all'; return; }
            if (currentTab === b.dataset.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
            currentTab = b.dataset.tab;
            writeUrl(false);
            applyMode();
        }));
        // Opening trash / shared links goes one level deeper (slides in from the right); leaving them
        // goes back up. Same motion as moving between pages, via nav-motion.js.
        const moveTo = (dir, change) => (window.navMotion ? navMotion.run(dir, change) : change());
        $('trashBtn').addEventListener('click', () => moveTo('forward', () => { currentView = 'trash'; writeUrl(true); applyMode(); }));
        $('sharesBtn').addEventListener('click', () => moveTo('forward', () => { currentView = 'shares'; writeUrl(true); applyMode(); }));
        $('backBtn').addEventListener('click', () => {
            if (history.state && history.state.photosMode) history.back();
            else moveTo('back', () => { currentView = null; writeUrl(false); applyMode(); });
        });
        window.addEventListener('popstate', () => {
            if (!authToken) return;
            const before = currentTab + '|' + currentView;
            const hadView = !!currentView;
            readModeFromUrl();
            if (before === currentTab + '|' + currentView) return;
            moveTo(hadView && !currentView ? 'back' : 'forward', applyMode);
        });

        // Back-to-top button: appears once the visitor is a couple of screens down. The scroll handler is
        // throttled to one frame so a long album list still scrolls smoothly on a phone.
        (function () {
            const btn = $('scrollTopBtn');
            if (!btn) return;
            let ticking = false;
            const update = () => { ticking = false; btn.classList.toggle('show', window.scrollY > 1000); };
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(update);
            }, { passive: true });
            update();
        })();

        async function apiJson(url, method = 'GET', body) {
            const headers = { Authorization: authToken };
            if (body) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { method, headers, credentials: 'include', cache: 'no-store', body: body ? JSON.stringify(body) : undefined });
            let d = {};
            try { d = await res.json(); } catch (e) {}
            if (!res.ok || d.success === false) throw new Error(d.message || 'เกิดข้อผิดพลาด');
            return d;
        }

        async function copyText(text) {
            try { await navigator.clipboard.writeText(text); return true; } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) {}
                ta.remove();
                return ok;
            }
        }

        // ===== รูปภาพ tab: timeline of every photo/video the visitor can open =====
        const THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const THAI_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const tl = { started: false, items: [], albums: {}, next: null, done: false, promise: null, groups: new Map(), months: [], total: 0 };
        let tlThumbObserver = null;

        function renderPhotoStats() {
            let photos = 0, videos = 0;
            for (const a of allAlbums) {
                if (!a.has_access || !a.name || a.name.startsWith('[DELETED] ')) continue;
                photos += a.photo_count || 0;
                videos += a.video_count || 0;
            }
            $('albumCountText').innerHTML =
                `<span><i class="fa-regular fa-image"></i>${fmt(photos)} รูป</span>` +
                `<span><i class="fa-solid fa-video"></i>${fmt(videos)} วิดีโอ</span>`;
        }

        function dayKey(ts) {
            const d = new Date(ts);
            return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        }

        function dayLabel(ts) {
            const d = new Date(ts);
            const date = `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
            const today = new Date();
            const yesterday = new Date(Date.now() - 86400000);
            if (d.toDateString() === today.toDateString()) return 'วันนี้ ' + date;
            if (d.toDateString() === yesterday.toDateString()) return 'เมื่อวาน ' + date;
            return d.toLocaleDateString('th-TH', { weekday: 'long' }).replace(/^วัน/, '') + ' ' + date;
        }

        function setTlStatus(html) { $('tlStatus').innerHTML = html; }

        function tlStart() {
            tl.started = true;
            if ('IntersectionObserver' in window) {
                tlThumbObserver = new IntersectionObserver(entries => entries.forEach(en => {
                    if (!en.isIntersecting) return;
                    tlThumbObserver.unobserve(en.target);
                    loadTlThumb(en.target);
                }), { rootMargin: '600px 0px' });
                new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) maybeLoadMoreTimeline();
                }, { rootMargin: '1200px 0px' }).observe($('tlSentinel'));
            }
            tlLoad(true);
        }

        function loadTlThumb(img) {
            img.onload = img.onerror = () => img.classList.add('loaded');
            img.src = img.dataset.src;
        }

        function maybeLoadMoreTimeline() {
            if (tl.done || tl.promise || currentTab !== 'photos' || currentView) return;
            if ($('tlSentinel').getBoundingClientRect().top < window.innerHeight + 1200) tlLoad(false);
        }

        function tlLoad(reset, before) {
            if (tl.promise) return reset ? tl.promise.then(() => tlLoad(true, before)) : tl.promise;
            if (!reset && tl.done) return Promise.resolve();
            tl.promise = (async () => {
                if (reset) {
                    tl.items = [];
                    tl.next = null;
                    tl.done = false;
                    tl.groups.clear();
                    $('tlGroups').innerHTML = '';
                }
                setTlStatus('<i class="fas fa-circle-notch fa-spin"></i> กำลังโหลดรูปภาพ...');
                try {
                    const q = new URLSearchParams({ limit: '150' });
                    const cursor = reset ? (before ? { before } : null) : tl.next;
                    if (cursor) {
                        q.set('before', cursor.before);
                        if (cursor.beforeId) q.set('beforeId', cursor.beforeId);
                    }
                    const d = await apiJson('/api/photos/timeline?' + q.toString());
                    tl.albums = Object.assign(tl.albums, d.albums || {});
                    if (d.months) { tl.months = d.months; tl.total = d.total || 0; renderMonthSelect(); }
                    appendTimeline(d.images || []);
                    tl.next = d.next || null;
                    tl.done = !d.next;
                    if (!tl.items.length) setTlStatus('<i class="fa-regular fa-images" style="font-size:2rem;opacity:.35;display:block;margin-bottom:8px"></i>ยังไม่มีรูปภาพ');
                    else setTlStatus(tl.done ? `แสดงครบ ${fmt(tl.items.length)} รายการ` : '');
                } catch (e) {
                    setTlStatus(`โหลดรูปภาพไม่สำเร็จ <button type="button" class="link-btn" data-tl-retry>ลองอีกครั้ง</button>`);
                } finally {
                    tl.promise = null;
                    setTimeout(maybeLoadMoreTimeline, 50);
                }
            })();
            return tl.promise;
        }

        function appendTimeline(images) {
            const container = $('tlGroups');
            const touched = new Set();
            for (const img of images) {
                const index = tl.items.push(img) - 1;
                const key = dayKey(img.created_at);
                let g = tl.groups.get(key);
                if (!g) {
                    const section = document.createElement('section');
                    section.className = 'tl-group';
                    section.innerHTML = `<h2 class="tl-day"><span>${esc(dayLabel(img.created_at))}</span><small></small></h2><div class="tl-grid"></div>`;
                    container.appendChild(section);
                    g = { count: 0, grid: section.querySelector('.tl-grid'), counter: section.querySelector('small') };
                    tl.groups.set(key, g);
                }
                g.count++;
                touched.add(g);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tl-item';
                btn.dataset.i = index;
                btn.setAttribute('aria-label', img.original_name || 'รูปภาพ');
                btn.innerHTML = `<img alt="" draggable="false" data-src="/api/image/${encodeURIComponent(img.id)}/thumb">` +
                    (img.file_type === 'video' ? '<span class="tl-video"><i class="fas fa-play"></i></span>' : '');
                g.grid.appendChild(btn);
                if (tlThumbObserver) tlThumbObserver.observe(btn.firstChild);
                else loadTlThumb(btn.firstChild);
            }
            touched.forEach(g => { g.counter.textContent = '· ' + fmt(g.count) + ' รายการ'; });
        }

        function renderMonthSelect() {
            const sel = $('monthSelect');
            sel.innerHTML = '<option value="">ล่าสุด</option>' + tl.months.map(m => {
                const [y, mo] = String(m.ym).split('-').map(Number);
                return `<option value="${Number(m.latest) + 1}">${THAI_MONTHS_FULL[mo - 1] || ''} ${y + 543} (${fmt(m.n)})</option>`;
            }).join('');
        }

        $('monthSelect').addEventListener('change', e => {
            const v = e.target.value;
            window.scrollTo(0, 0);
            tlLoad(true, v ? Number(v) : null);
        });

        $('photosPane').addEventListener('click', e => {
            if (e.target.closest('[data-tl-retry]')) { tlLoad(!tl.items.length); return; }
            const item = e.target.closest('.tl-item');
            if (item) openTimelineViewer(Number(item.dataset.i));
        });

        function openTimelineViewer(index) {
            const it = tl.items[index];
            if (!it) return;
            if (!window.PhotosViewer) { openAlbum(it.album_id); return; }
            PhotosViewer.open({
                items: tl.items,
                index,
                src: (item, variant) => '/api/image/' + encodeURIComponent(item.id) + '/' + variant,
                caption: item => (tl.albums[item.album_id] || '') + ' · ' + formatShortDate(item.created_at),
                downloadUrl: item => '/api/image/' + encodeURIComponent(item.id) + '/original?download=1',
                actions: [{ icon: 'fas fa-folder-open', label: 'เปิดอัลบั้ม', run: item => openAlbum(item.album_id) }],
                loadMore: async () => {
                    if (tl.done) return null;
                    const count = tl.items.length;
                    await tlLoad(false);
                    return tl.items.slice(count);
                }
            });
        }

        // ===== ถังขยะ =====
        const trash = { data: null, images: [], nextOffset: 0, selected: new Set(), loading: false };
        const daysLeft = ts => Math.max(0, Math.ceil((ts - Date.now()) / 86400000));
        const daysText = ts => { const n = daysLeft(ts); return n ? `เหลือ ${fmt(n)} วัน` : 'จะถูกลบถาวรเร็ว ๆ นี้'; };

        async function loadTrash(reset) {
            if (trash.loading) return;
            const pane = $('trashPane');
            if (reset) {
                trash.selected.clear();
                trash.images = [];
                trash.nextOffset = 0;
                pane.innerHTML = '<div class="pane-status"><i class="fas fa-circle-notch fa-spin"></i> กำลังโหลดถังขยะ...</div>';
            }
            trash.loading = true;
            try {
                const d = await apiJson('/api/photos/trash?limit=200&offset=' + (trash.nextOffset || 0));
                trash.data = d;
                trash.images = trash.images.concat(d.images || []);
                trash.nextOffset = d.next_offset;
                renderTrash();
            } catch (e) {
                pane.innerHTML = `<div class="pane-status">${esc(e.message)} <button type="button" class="link-btn" data-trash="reload">ลองอีกครั้ง</button></div>`;
            } finally {
                trash.loading = false;
            }
        }

        function renderTrash() {
            const d = trash.data || { albums: [], image_total: 0 };
            const albums = d.albums || [];
            const pane = $('trashPane');
            if (currentView === 'trash') {
                $('albumCountText').innerHTML = `<span><i class="fas fa-folder"></i>${fmt(albums.length)} โฟลเดอร์</span><span><i class="fa-regular fa-file"></i>${fmt(d.image_total || 0)} ไฟล์</span>`;
            }
            if (!albums.length && !trash.images.length) {
                pane.innerHTML = '<div class="pane-empty"><i class="fas fa-trash-can"></i><div>ถังขยะว่างเปล่า</div><small>รายการที่ลบจะอยู่ที่นี่ 30 วันก่อนถูกลบถาวร</small></div>';
                return;
            }
            const folderCards = albums.map(a => `
                <div class="trash-folder" data-id="${esc(a.id)}">
                    <div class="tf-cover${a.locked ? ' locked' : ''}">${a.locked ? '<i class="fas fa-lock"></i>' : a.cover_id ? `<img src="/api/image/${encodeURIComponent(a.cover_id)}/thumb" alt="" loading="lazy">` : '<i class="fas fa-folder"></i>'}</div>
                    <div class="tf-info">
                        <div class="tf-name">${esc(a.name)}</div>
                        <div class="tf-meta">${a.from ? 'จาก ' + esc(a.from.name) : 'กู้คืนไปที่หน้าหลัก'}${a.folders ? ' · ' + fmt(a.folders) + ' โฟลเดอร์ย่อย' : ''} · ${fmt(a.items)} ไฟล์</div>
                        <div class="tf-days">${daysText(a.expires_at)}</div>
                    </div>
                    <div class="tf-actions">
                        <button type="button" class="pill-btn" data-trash="restore-album" aria-label="กู้คืน"><i class="fas fa-rotate-left"></i><span>กู้คืน</span></button>
                        <button type="button" class="pill-btn danger" data-trash="purge-album" aria-label="ลบถาวร"><i class="fas fa-xmark"></i><span>ลบถาวร</span></button>
                    </div>
                </div>`).join('');
            const fileTiles = trash.images.map(f => {
                const on = trash.selected.has(f.id);
                return `
                <label class="trash-file${on ? ' selected' : ''}" data-id="${esc(f.id)}">
                    <input type="checkbox" data-trash="pick"${on ? ' checked' : ''} aria-label="เลือก ${esc(f.name)}">
                    <span class="tfile-check"><i class="fas fa-check"></i></span>
                    <div class="tfile-thumb">${f.locked ? '<i class="fas fa-lock"></i>' : `<img src="/api/image/${encodeURIComponent(f.id)}/thumb" alt="" loading="lazy">`}${f.file_type === 'video' ? '<span class="tl-video"><i class="fas fa-play"></i></span>' : ''}</div>
                    <div class="tfile-name">${esc(f.name)}</div>
                    <div class="tfile-meta">${f.album && f.album.alive ? esc(f.album.name) : '<span class="warn">อัลบั้มถูกลบ</span>'} · ${daysText(f.expires_at)}</div>
                </label>`;
            }).join('');
            const n = trash.selected.size;
            pane.innerHTML = `
                <div class="trash-notice"><i class="fas fa-circle-info"></i><span>รายการในถังขยะจะถูกลบถาวรอัตโนมัติหลัง 30 วัน</span><button type="button" class="pill-btn danger" data-trash="empty"><i class="fas fa-trash-can"></i><span>ล้างถังขยะ</span></button></div>
                ${albums.length ? `<h2 class="pane-title"><i class="fas fa-folder"></i> โฟลเดอร์ <b>${fmt(albums.length)}</b></h2><div class="trash-folders">${folderCards}</div>` : ''}
                ${trash.images.length ? `
                    <h2 class="pane-title"><i class="fa-regular fa-file"></i> ไฟล์ <b>${fmt(d.image_total || trash.images.length)}</b></h2>
                    <div class="trash-bulk">
                        <label class="select-all"><input type="checkbox" data-trash="select-all"${n && trash.images.every(i => trash.selected.has(i.id)) ? ' checked' : ''}> เลือกทั้งหมด</label>
                        <span class="bulk-count">${n ? 'เลือก ' + fmt(n) + ' ไฟล์' : ''}</span>
                        <button type="button" class="pill-btn" data-trash="restore-selected"${n ? '' : ' disabled'}><i class="fas fa-rotate-left"></i><span>กู้คืน</span></button>
                        <button type="button" class="pill-btn danger" data-trash="purge-selected"${n ? '' : ' disabled'}><i class="fas fa-xmark"></i><span>ลบถาวร</span></button>
                    </div>
                    <div class="trash-files">${fileTiles}</div>
                    ${trash.nextOffset != null ? '<div class="pane-more"><button type="button" class="pill-btn" data-trash="more">โหลดเพิ่ม</button></div>' : ''}` : ''}`;
        }

        function updateTrashSelectionUI() {
            const pane = $('trashPane');
            pane.querySelectorAll('.trash-file').forEach(el => {
                const on = trash.selected.has(el.dataset.id);
                el.classList.toggle('selected', on);
                const cb = el.querySelector('input');
                if (cb) cb.checked = on;
            });
            const n = trash.selected.size;
            const count = pane.querySelector('.bulk-count');
            if (count) count.textContent = n ? 'เลือก ' + fmt(n) + ' ไฟล์' : '';
            pane.querySelectorAll('[data-trash="restore-selected"], [data-trash="purge-selected"]').forEach(b => { b.disabled = !n; });
            const all = pane.querySelector('[data-trash="select-all"]');
            if (all) all.checked = n > 0 && trash.images.every(i => trash.selected.has(i.id));
        }

        $('trashPane').addEventListener('change', e => {
            const t = e.target;
            if (t.matches('[data-trash="pick"]')) {
                const id = t.closest('[data-id]').dataset.id;
                if (t.checked) trash.selected.add(id); else trash.selected.delete(id);
                updateTrashSelectionUI();
            } else if (t.matches('[data-trash="select-all"]')) {
                if (t.checked) trash.images.forEach(i => trash.selected.add(i.id)); else trash.selected.clear();
                updateTrashSelectionUI();
            }
        });

        $('trashPane').addEventListener('click', e => {
            const b = e.target.closest('button[data-trash]');
            if (!b) return;
            const act = b.dataset.trash;
            const card = b.closest('.trash-folder');
            if (act === 'reload') return loadTrash(true);
            if (act === 'more') return loadTrash(false);
            if (act === 'restore-album') return trashRestore({ albums: [card.dataset.id] }, 0);
            if (act === 'purge-album') {
                const a = ((trash.data && trash.data.albums) || []).find(x => x.id === card.dataset.id);
                return trashPurge({ albums: [card.dataset.id] }, `ลบ "${a ? a.name : 'โฟลเดอร์นี้'}" และทุกไฟล์ข้างในถาวร`);
            }
            if (act === 'restore-selected') {
                const ids = [...trash.selected];
                const restorable = ids.filter(id => { const f = trash.images.find(i => i.id === id); return f && f.album && f.album.alive; });
                if (!restorable.length) { showToast('ไฟล์ที่เลือกอยู่ในอัลบั้มที่ถูกลบ ให้กู้คืนอัลบั้มก่อน', 'error'); return; }
                return trashRestore({ images: restorable }, ids.length - restorable.length);
            }
            if (act === 'purge-selected') return trashPurge({ images: [...trash.selected] }, `ลบ ${fmt(trash.selected.size)} ไฟล์ที่เลือกถาวร`);
            if (act === 'empty') return trashPurge({ all: true }, 'ลบทุกรายการในถังขยะถาวร');
        });

        async function trashRestore(body, skippedHere) {
            showToast('<i class="fas fa-circle-notch fa-spin"></i> กำลังกู้คืน...', 'success', true);
            try {
                const d = await apiJson('/api/photos/trash/restore', 'POST', { albums: body.albums || [], images: body.images || [] });
                const parts = [];
                if (d.restoredAlbums) parts.push(fmt(d.restoredAlbums) + ' โฟลเดอร์');
                if (d.restoredImages) parts.push(fmt(d.restoredImages) + ' ไฟล์');
                const skipped = d.skipped || [];
                let msg = parts.length ? 'กู้คืนแล้ว ' + parts.join(' และ ') : 'ไม่มีรายการที่กู้คืนได้';
                const skippedCount = skipped.length + (skippedHere || 0);
                if (skippedCount) msg += ` · ข้าม ${fmt(skippedCount)} รายการ (${esc(skipped[0] ? skipped[0].reason : 'อัลบั้มของไฟล์ถูกลบ')})`;
                showToast(msg, parts.length ? 'success' : 'error');
                loadTrash(true);
                loadAlbums(true);
            } catch (e) { showToast(esc(e.message), 'error'); }
        }

        async function trashPurge(body, what) {
            const ok = await showCustomConfirm({ title: 'ลบถาวร?', message: what + ' · การลบนี้ย้อนกลับไม่ได้', isDanger: true, confirmText: 'ลบถาวร', cancelText: 'ยกเลิก' });
            if (!ok) return;
            showToast('<i class="fas fa-circle-notch fa-spin"></i> กำลังลบถาวร...', 'success', true);
            try {
                const d = await apiJson('/api/photos/trash/purge', 'POST', body);
                showToast(`ลบถาวรแล้ว ${fmt(d.albums)} โฟลเดอร์ ${fmt(d.images)} ไฟล์`, 'success');
                loadTrash(true);
            } catch (e) { showToast(esc(e.message), 'error'); }
        }

        // ===== ลิงก์ที่แชร์ =====
        let sharesList = [];
        const shareLink = id => (window.PhotosFolders && PhotosFolders.shareUrl) ? PhotosFolders.shareUrl(id) : location.origin + '/s/?t=' + encodeURIComponent(id);

        async function loadShares() {
            const pane = $('sharesPane');
            pane.innerHTML = '<div class="pane-status"><i class="fas fa-circle-notch fa-spin"></i> กำลังโหลดลิงก์...</div>';
            try {
                const d = await apiJson('/api/photos/shares');
                sharesList = d.shares || [];
                renderShares();
            } catch (e) {
                pane.innerHTML = `<div class="pane-status">${esc(e.message)} <button type="button" class="link-btn" data-share="reload">ลองอีกครั้ง</button></div>`;
            }
        }

        function renderShares() {
            const pane = $('sharesPane');
            if (currentView === 'shares') $('albumCountText').innerHTML = `<span><i class="fas fa-link"></i>${fmt(sharesList.length)} ลิงก์ที่ใช้งานอยู่</span>`;
            if (!sharesList.length) {
                pane.innerHTML = '<div class="pane-empty"><i class="fas fa-link"></i><div>ยังไม่มีลิงก์ที่แชร์</div><small>แชร์โฟลเดอร์ได้จากเมนูของอัลบั้ม หรือแชร์ไฟล์จากเมนูของรูป</small></div>';
                return;
            }
            pane.innerHTML = '<div class="share-list">' + sharesList.map(sh => {
                const isAlbum = sh.kind === 'album';
                const expiry = sh.expired ? '<span class="warn">หมดอายุแล้ว</span>' : (sh.expires_at ? 'หมดอายุ ' + formatShortDate(sh.expires_at) : 'ไม่หมดอายุ');
                return `
                <div class="share-row${sh.expired ? ' expired' : ''}" data-id="${esc(sh.id)}">
                    <div class="sr-ico ${isAlbum ? 'album' : 'file'}"><i class="fas ${isAlbum ? 'fa-folder' : 'fa-image'}"></i></div>
                    <div class="sr-main">
                        <div class="sr-name">${sh.target ? esc(sh.target.name) : '<span class="warn">ถูกลบแล้ว</span>'}</div>
                        <div class="sr-meta">${isAlbum ? 'โฟลเดอร์' : 'ไฟล์'} · ${expiry} · สร้าง ${formatShortDate(sh.created_at)} · เปิดดู ${fmt(sh.view_count)} ครั้ง</div>
                        <div class="sr-badges"><span class="badge">${sh.allow_download ? 'ดาวน์โหลดได้' : 'ดูอย่างเดียว'}</span>${isAlbum && sh.include_subfolders ? '<span class="badge">รวมโฟลเดอร์ย่อย</span>' : ''}</div>
                    </div>
                    <div class="sr-actions">
                        <button type="button" class="icon-pill" data-share="copy" title="คัดลอกลิงก์" aria-label="คัดลอกลิงก์"><i class="far fa-copy"></i></button>
                        <button type="button" class="icon-pill" data-share="edit" title="แก้ไขสิทธิ์" aria-label="แก้ไขสิทธิ์"><i class="fas fa-sliders"></i></button>
                        <button type="button" class="icon-pill" data-share="open" title="เปิดลิงก์" aria-label="เปิดลิงก์"><i class="fas fa-arrow-up-right-from-square"></i></button>
                        <button type="button" class="icon-pill danger" data-share="revoke" title="ยกเลิกลิงก์" aria-label="ยกเลิกลิงก์"><i class="fas fa-link-slash"></i></button>
                    </div>
                </div>`;
            }).join('') + '</div>';
        }

        $('sharesPane').addEventListener('click', async e => {
            const b = e.target.closest('button[data-share]');
            if (!b) return;
            const act = b.dataset.share;
            if (act === 'reload') return loadShares();
            const id = b.closest('[data-id]').dataset.id;
            if (act === 'copy') {
                const ok = await copyText(shareLink(id));
                showToast(ok ? 'คัดลอกลิงก์แล้ว' : 'คัดลอกไม่สำเร็จ', ok ? 'success' : 'error');
            } else if (act === 'open') {
                window.open(shareLink(id), '_blank', 'noopener');
            } else if (act === 'edit') {
                const share = sharesList.find(sh => sh.id === id);
                if (!share || !window.PhotosFolders) return;
                PhotosFolders.openShareEditor(share, updated => {
                    sharesList = sharesList.map(sh => (sh.id === id ? updated : sh));
                    renderShares();
                });
            } else if (act === 'revoke') {
                const ok = await showCustomConfirm({ title: 'ยกเลิกลิงก์นี้?', message: 'คนที่มีลิงก์นี้จะเปิดไม่ได้อีก', isDanger: true, confirmText: 'ยกเลิกลิงก์', cancelText: 'ย้อนกลับ', icon: 'fas fa-link-slash' });
                if (!ok) return;
                try {
                    await apiJson('/api/photos/shares/' + encodeURIComponent(id), 'DELETE');
                    sharesList = sharesList.filter(sh => sh.id !== id);
                    renderShares();
                    showToast('ยกเลิกลิงก์แล้ว', 'success');
                } catch (err) { showToast(esc(err.message), 'error'); }
            }
        });

        // ===== Floating menus close as soon as anything scrolls =====
        // Covers window scroll, scrolling inside any container (capturing), wheel, and touch drags. A touch that
        // began before the menu opened (the long-press that opened it) never closes it.
        let touchBeganWithMenuOpen = false;
        const menuIsOpen = () => !!document.querySelector('.pf-menu.show');
        function closeFloatingMenus(e) {
            const t = e && e.target;
            if (t && t.closest && t.closest('.pf-menu')) return;
            if (!menuIsOpen() || !window.PhotosFolders) return;
            // The menu itself decides: it ignores the tail of the long-press that opened it and any
            // scroll too small to be intentional, then fades out.
            if (PhotosFolders.requestCloseMenu) PhotosFolders.requestCloseMenu(e);
            else if (PhotosFolders.closeMenu) PhotosFolders.closeMenu();
        }
        window.addEventListener('scroll', closeFloatingMenus, { capture: true, passive: true });
        window.addEventListener('wheel', closeFloatingMenus, { capture: true, passive: true });
        window.addEventListener('touchstart', () => { touchBeganWithMenuOpen = menuIsOpen(); }, { capture: true, passive: true });
        window.addEventListener('touchmove', e => { if (touchBeganWithMenuOpen) closeFloatingMenus(e); }, { capture: true, passive: true });

        // ===== Init =====
        const saved = getCookie('photos_token') || localStorage.getItem('photos_token');
        if (saved) {
            authToken = saved;
            sessionStorage.setItem('photos_token', saved);
            showApp();
        } else {
            document.documentElement.classList.remove('has-token');
        }

        // Revalidate while the tab is visible (cheap 304s when nothing changed); never poll hidden tabs.
        setInterval(() => { if (authToken && !document.hidden) loadAlbums(false); }, 30000);
        document.addEventListener('visibilitychange', () => { if (authToken && !document.hidden) loadAlbums(false); });
        window.addEventListener('pageshow', e => { if (e.persisted && authToken) loadAlbums(false); });
    </script>
</body>
</html>
