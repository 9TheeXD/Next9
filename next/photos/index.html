<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- Directional page slides; must run before first paint, so a plain blocking script. -->
    <script src="/nav-motion.js"></script>
    <script>
        (function() {
            var ua = navigator.userAgent.toLowerCase();
            var isLine = ua.indexOf('line') > -1;
            var isFB = ua.indexOf('fbav') > -1 || ua.indexOf('fban') > -1;
            var isIG = ua.indexOf('instagram') > -1;
            var isAndroid = ua.indexOf('android') > -1;
            if (isLine && location.search.indexOf('openExternalBrowser=1') === -1) {
                location.href = location.href + (location.search ? '&' : '?') + 'openExternalBrowser=1';
            } else if ((isFB || isIG) && isAndroid) {
                location.href = 'intent://' + location.href.split('//')[1] + '#Intent;scheme=https;end';
            }
            // Signed-in visitors go straight to the app shell: no login-screen flash while scripts load.
            try {
                if (/(^|;\s*)photos_token=/.test(document.cookie) || localStorage.getItem('photos_token')) {
                    document.documentElement.className += ' has-token';
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/photos.svg">
    <title>อัลบั้มรูป - สภานักเรียน</title>
    <meta name="description" content="อัลบั้มรูปภาพกิจกรรมพรรค NEXT9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <!-- Fonts and icons load without blocking the first paint; everything the page needs to render is inline below. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <script src="/photos/folders.js" defer></script>
    <script src="/photos/viewer.js" defer></script>
    <style>
        /* ---- Base (the subset of /style.css this page uses, inlined so nothing blocks rendering) ---- */
        :root {
            --primary: #ffffff;
            --accent: #b00909;
            --accent-dark: #b30000;
            --text-dark: #121212;
            --text-light: #555555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Prompt', 'Outfit', sans-serif;
            background-color: #f5f5f5;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }
        h1, h2, h3 { font-family: 'Outfit', 'Prompt', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; }
        a { text-decoration: none; color: inherit; }
        @keyframes toiletFadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        html.has-token #loginPage { display: none; }
        html.has-token #app { display: block !important; }

        .toilet-login-input { width: 100%; padding: 14px 18px; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; background: rgba(255,255,255,0.08); color: white; font-size: 1rem; font-family: 'Prompt', sans-serif; outline: none; transition: all 0.3s; margin-bottom: 16px; }
        .toilet-login-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.12); box-shadow: 0 0 0 3px rgba(176,9,9,0.2); }
        .toilet-login-input::placeholder { color: rgba(255,255,255,0.3); }
        .toilet-login-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: 'Prompt', sans-serif; transition: all 0.3s; }
        .toilet-login-btn:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(176,9,9,0.4); }
        .toilet-login-error { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; min-height: 20px; }
        .toilet-toast { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(150%); opacity: 0; visibility: hidden; background: #333; color: white; padding: 14px 28px; border-radius: 10px; font-family: 'Prompt', sans-serif; font-size: 0.9rem; z-index: 99999; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease, visibility 0s linear 0.3s; box-shadow: 0 8px 30px rgba(0,0,0,0.3); max-width: calc(100vw - 32px); }
        .toilet-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease, visibility 0s; }
        .toilet-toast.success { background: #059669; }
        .toilet-toast.error { background: #dc2626; }

        .photos-page { min-height: 100vh; background: #f5f5f5; font-family: 'Prompt', 'Outfit', sans-serif; color: var(--text-dark); }
        .photos-page ::placeholder { color: #ffffffb4; }
        .photos-header { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 50%, #7a0606 100%); padding: 28px 5% 20px; color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .photos-header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .photos-header h1 { font-size: 1.6rem; font-weight: 700; text-transform: none; letter-spacing: normal; display: flex; align-items: center; gap: 10px; }
        .photos-header h1 i { font-size: 1.3rem; }
        .photos-header-btn { height: 39px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; background: rgba(255,255,255,0.1); color: white; font-family: 'Prompt', sans-serif; font-size: 0.85rem; font-weight: 600; line-height: 1; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .photos-header-btn:hover { background: rgba(255,255,255,0.25); }
        .photos-toolbar { max-width: 1200px; margin: 14px auto 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .photos-content { max-width: 1200px; margin: 20px auto 24px; padding: 0 16px 60px; }
        .photos-album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .photos-login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); font-family: 'Prompt', 'Outfit', sans-serif; }
        .photos-login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 48px 40px; max-width: 400px; width: 90%; text-align: center; animation: toiletFadeUp 0.6s ease-out forwards; }
        .photos-login-card h2 { color: white; font-size: 1.6rem; margin-bottom: 8px; text-transform: none; letter-spacing: normal; }
        .photos-login-card .login-sub { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 32px; }
        .photos-login-card .login-icon { font-size: 3rem; margin-bottom: 16px; color: white; }

        /* ---- Header stats ---- */
        .header-stats { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 4px; font-size: 0.84rem; min-height: 24px; }
        .header-stats span { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.88); white-space: nowrap; }
        .header-stats i { font-size: 0.78rem; color: rgba(255,255,255,0.6); }
        .header-stats .stat-note { color: #ffd7cf; font-weight: 500; }
        .sk-light { display: inline-block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(255,255,255,.14) 25%, rgba(255,255,255,.28) 37%, rgba(255,255,255,.14) 63%); background-size: 400% 100%; animation: skShimmer 1.4s ease infinite; }

        /* ---- Search & sort ---- */
        .search-box { flex: 1; min-width: 180px; position: relative; }
        .search-box input { width: 100%; padding: 9px 34px 9px 36px; border: none; border-radius: 8px; background: rgba(255,255,255,0.15); color: white; font-family: 'Prompt', sans-serif; font-size: 0.85rem; outline: none; }
        .search-box input:focus { background: rgba(255,255,255,0.24); }
        .search-box input::-webkit-search-cancel-button { display: none; }
        .search-box .fa-search { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.55); font-size: 0.8rem; }
        .search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; }
        .filter-select-wrapper { position: relative; display: inline-flex; align-items: center; }
        .filter-select-wrapper select { padding: 9px 34px 9px 36px; border: none; border-radius: 8px; background: rgba(255,255,255,0.15); color: white; font-family: 'Prompt', sans-serif; font-size: 0.85rem; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; }
        .filter-select-wrapper .select-icon-left { position: absolute; left: 12px; color: rgba(255,255,255,0.7); font-size: 0.85rem; pointer-events: none; }
        .filter-select-wrapper .select-icon-right { position: absolute; right: 12px; color: rgba(255,255,255,0.5); font-size: 0.75rem; pointer-events: none; }
        .filter-select-wrapper select option { color: #1f2937; background: white; }

        /* ---- Sections ---- */
        .grid-section { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 0.92rem; font-weight: 600; color: #374151; margin: 10px 2px -6px; }
        .grid-section:first-child { margin-top: 0; }
        .grid-section i { color: var(--accent); font-size: 0.85rem; }
        .grid-section b { font-size: 0.72rem; font-weight: 600; color: var(--accent); background: rgba(176,9,9,0.08); padding: 1px 8px; border-radius: 999px; }
        .grid-section .pin-ico { transform: rotate(35deg); }
        .grid-empty, .grid-error { grid-column: 1 / -1; text-align: center; color: #6b7280; padding: 48px 16px; }
        .grid-error button { margin-top: 12px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-family: 'Prompt', sans-serif; font-weight: 600; cursor: pointer; }

        /* ---- Album cards ---- */
        .photos-album-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: none; transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.22s cubic-bezier(0.2,0.8,0.2,1); position: relative; display: flex; flex-direction: column; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; will-change: transform; outline: none; }
        .photos-album-card:focus-visible { box-shadow: 0 0 0 3px rgba(176,9,9,0.45); }
        .photos-album-card.in-view { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .photos-album-card.in-view:hover { transform: translateY(-4px) scale(1.025); box-shadow: 0 14px 36px rgba(0,0,0,0.22); z-index: 10; }
        .photos-album-card.pinned { box-shadow: 0 0 0 2px rgba(176,9,9,0.5), 0 4px 16px rgba(176,9,9,0.10); }
        .photos-album-cover { position: relative; width: 100%; aspect-ratio: 16 / 11; overflow: hidden; background: #1e293b; }
        .cover-collage { width: 100%; height: 100%; display: grid; gap: 1.5px; background: #ffffff; }
        .cover-collage.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .cover-collage.count-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .cover-collage.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .cover-collage.count-3 .cover-img-wrapper:nth-child(1) { grid-column: span 2; }
        .cover-img-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1e293b; }
        .cover-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
        .cover-badge-time { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); color: white; padding: 3px 9px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; z-index: 4; pointer-events: none; }
        .cover-actions { position: absolute; top: 8px; right: 8px; z-index: 6; }
        .cover-more-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.75); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: background 0.2s, transform 0.2s; }
        .cover-more-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.08); }
        .photos-album-card.in-view .cover-badge-time,
        .photos-album-card.in-view .cover-more-btn { background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .photos-album-info { padding: 10px 12px 12px; background: white; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .photos-album-info h3 { margin: 0 0 6px 0; font-size: 0.92rem; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
        .photos-album-info h3 .pin-ico { color: var(--accent); font-size: 0.72rem; margin-right: 6px; transform: rotate(35deg); display: inline-block; }
        .photos-album-info h3 .lock-ico { color: #f59e0b; font-size: 0.8rem; margin-right: 6px; }
        .album-path { font-size: 0.72rem; color: #9ca3af; margin: -3px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-path i { margin-right: 4px; }
        .album-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.76rem; color: #6b7280; }
        .album-counts { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; }
        .album-counts i { color: #9ca3af; margin-right: 3px; }
        .album-date { font-size: 0.76rem; color: #6b7280; white-space: nowrap; }
        .empty-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #1e293b; color: rgba(255,255,255,0.4); font-size: 2.2rem; }
        .create-card { border: 2px dashed #d1d5db; background: transparent; box-shadow: none !important; }
        .create-card:hover { border-color: var(--accent); }
        .create-card .photos-album-cover { background: rgba(176,9,9,0.04); display: flex; align-items: center; justify-content: center; }
        .create-card .photos-album-info { background: transparent; }
        .photos-album-card.pf-pressing { transform: scale(0.96) !important; transition: transform 0.45s ease !important; }

        /* ---- Skeleton ---- */
        @keyframes skShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
        .sk { background: linear-gradient(90deg, #e9ebef 25%, #f4f5f7 37%, #e9ebef 63%); background-size: 400% 100%; animation: skShimmer 1.4s ease infinite; }
        .sk-card { cursor: default; pointer-events: none; }
        .sk-card .photos-album-cover { background: none; }
        .sk-line { height: 12px; border-radius: 6px; margin: 4px 0 8px; width: 70%; }
        .sk-line.short { width: 40%; margin-bottom: 0; }

        /* ---- Custom Modal System (z-index 99999) ---- */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 99999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; font-family: 'Prompt', sans-serif; }
        .custom-modal-overlay.show { opacity: 1; visibility: visible; }
        .custom-modal-box { background: white; border-radius: 20px; padding: 26px 24px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.3); transform: scale(0.92); transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1); }
        .custom-modal-overlay.show .custom-modal-box { transform: scale(1); }
        .custom-modal-icon { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
        .custom-modal-icon.info { background: rgba(59,130,246,0.12); color: #3b82f6; }
        .custom-modal-icon.danger { background: rgba(239,68,68,0.12); color: #ef4444; }
        .custom-modal-icon.warning { background: rgba(245,158,11,0.12); color: #f59e0b; }
        .custom-modal-box h3 { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; color: #111827; text-transform: none; letter-spacing: normal; }
        .custom-modal-box p { margin: 0 0 16px; font-size: 0.88rem; color: #6b7280; line-height: 1.45; }
        .custom-modal-input { width: 100%; padding: 11px 14px; border: 1.5px solid #d1d5db; border-radius: 10px; font-family: 'Prompt', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .custom-modal-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(176,9,9,0.15); }
        .custom-modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
        .btn-modal { padding: 10px 18px; border-radius: 10px; font-family: 'Prompt', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; flex: 1; transition: background 0.15s, transform 0.1s; }
        .btn-modal:active { transform: scale(0.97); }
        .btn-modal.btn-cancel { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
        .btn-modal.btn-cancel:hover { background: #e5e7eb; }
        .btn-modal.btn-confirm { background: var(--accent); color: white; }
        .btn-modal.btn-confirm.danger { background: #dc2626; }
        .btn-modal.btn-confirm.danger:hover { background: #b91c1c; }

        @media (max-width: 600px) {
            .photos-header { padding: 20px 16px 16px; }
            .photos-header h1 { font-size: 1.35rem; }
            .photos-header-btn span { display: none; }
            .photos-album-card { transition: none !important; transform: none !important; }
            .photos-album-card.in-view { box-shadow: none !important; }
            .photos-album-card.pinned { box-shadow: 0 0 0 2px rgba(176,9,9,0.5) !important; }
            .photos-album-card.in-view:hover { box-shadow: none !important; transform: none !important; }
            .photos-album-card.in-view .cover-badge-time,
            .photos-album-card.in-view .cover-more-btn { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; background: rgba(0,0,0,0.8) !important; }
        }
        @media (max-width: 480px) {
            .photos-album-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .cover-badge-time { display: none; }
            .album-date { display: none; }
            .photos-content { padding: 0 10px 60px; }
        }

        /* ---- Views, tabs ---- */
        [hidden] { display: none !important; }
        .header-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .back-btn { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-size: 1rem; }
        .back-btn:hover { background: rgba(255,255,255,0.25); }
        .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .photos-content { padding-bottom: 120px; }
        .tabbar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 150; display: flex; gap: 4px; padding: 5px; background: rgba(255,255,255,0.97); border: 1px solid #e5e7eb; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,0.14); font-family: 'Prompt', sans-serif; }
        .tabbar button { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: transparent; font: 600 0.9rem 'Prompt', sans-serif; color: #4b5563; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .tabbar button:hover { color: #111827; }
        .tabbar button.active { background: var(--accent); color: #fff; }
        .tabbar button:focus-visible { outline: 3px solid rgba(176,9,9,0.4); outline-offset: 2px; }
        html.has-tabbar .toilet-toast { bottom: calc(92px + env(safe-area-inset-bottom)); }
        .photos-top-btn { position: fixed; right: 18px; bottom: 18px; z-index: 160; width: 46px; height: 46px; border: 0; border-radius: 50%; background: rgba(17,24,39,0.82); color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.25); opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .18s, transform .18s, visibility .18s; }
        .photos-top-btn.show { opacity: 1; visibility: visible; transform: none; }
        .photos-top-btn:hover { background: var(--accent); }
        html.has-tabbar .photos-top-btn { bottom: calc(88px + env(safe-area-inset-bottom)); }
        /* Custom scrollbar, page-wide. The thumb is inset by a transparent border so it reads as a
           floating pill rather than a bar wedged against the edge. */
        html { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.22) transparent; }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.22); border: 3px solid transparent; background-clip: padding-box; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.34); background-clip: padding-box; }
        ::-webkit-scrollbar-corner { background: transparent; }

        /* ---- Timeline ---- */
        .tl-group { margin-bottom: 22px; }
        .tl-day { font-family: 'Prompt', sans-serif; text-transform: none; letter-spacing: normal; display: flex; align-items: baseline; gap: 8px; font-size: 0.92rem; font-weight: 600; color: #374151; margin: 0 2px 8px; }
        .tl-day small { font-weight: 400; color: #9ca3af; font-size: 0.78rem; }

        /* ---- Trash & shares ---- */
        .pane-title { font-family: 'Prompt', sans-serif; text-transform: none; letter-spacing: normal; font-size: 0.95rem; font-weight: 600; color: #374151; display: flex; align-items: center; gap: 8px; margin: 22px 2px 10px; }
        .pane-title i { color: var(--accent); }
        .pane-title b { font-size: 0.72rem; color: var(--accent); background: rgba(176,9,9,0.08); padding: 1px 8px; border-radius: 999px; }
        .pane-status, .pane-empty { text-align: center; color: #6b7280; padding: 56px 16px; }

        .pane-more { text-align: center; margin: 18px 0; }
        .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }
        .warn { color: #dc2626; }
        .pill-btn { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #e5e7eb; background: #fff; color: #374151; font: 600 0.82rem 'Prompt', sans-serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
        .pill-btn:hover:not(:disabled) { border-color: #9ca3af; }
        .pill-btn.danger { color: #dc2626; }
        .pill-btn.danger:hover:not(:disabled) { background: #fef2f2; border-color: #fecaca; }
        .pill-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .trash-notice { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 0.86rem; }
        .trash-notice span { flex: 1; min-width: 200px; }
        .trash-folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
        .trash-folder { display: flex; align-items: center; gap: 12px; padding: 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; }
        .tf-cover { width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #fdeaea; color: #b00909; display: grid; place-items: center; font-size: 1.4rem; }
        .tf-cover img { width: 100%; height: 100%; object-fit: cover; }
        .tf-cover.locked { background: #374151; color: #f59e0b; }
        .tf-info { flex: 1; min-width: 0; }

        .tf-meta { font-size: 0.76rem; color: #6b7280; }

        .tf-actions { display: flex; flex-direction: column; gap: 6px; }
        .trash-bulk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 12px; }
        .select-all { display: inline-flex; align-items: center; gap: 6px; font-size: 0.86rem; color: #374151; cursor: pointer; min-height: 36px; }
        .select-all input { width: 18px; height: 18px; accent-color: var(--accent); }
        .bulk-count { flex: 1; font-size: 0.82rem; color: #6b7280; }
        .trash-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .trash-file { position: relative; display: block; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .trash-file.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(176,9,9,0.35); }
        .trash-file input { position: absolute; opacity: 0; pointer-events: none; }
        .trash-file input:focus-visible ~ .tfile-check { box-shadow: 0 0 0 3px rgba(176,9,9,0.45); }
        .tfile-check { position: absolute; top: 8px; left: 8px; z-index: 2; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.35); color: transparent; display: grid; place-items: center; font-size: 0.65rem; }
        .trash-file.selected .tfile-check { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tfile-thumb { position: relative; aspect-ratio: 4 / 3; background: #e5e7eb; display: grid; place-items: center; color: #9ca3af; font-size: 1.3rem; }
        .tfile-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tfile-name { padding: 6px 8px 0; font-size: 0.8rem; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tfile-meta { padding: 0 8px 8px; font-size: 0.7rem; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .share-list { display: flex; flex-direction: column; gap: 10px; }
        .share-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; }
        .share-row.expired { opacity: 0.6; }
        .sr-ico { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; display: grid; place-items: center; font-size: 1.1rem; }
        .sr-ico.album { background: #fdeaea; color: #b00909; }

<body>
    <!-- Login Gate -->
    <div id="loginPage" class="photos-login-page">
        <div class="photos-login-card">
            <div class="login-icon"><i class="fas fa-camera-retro"></i></div>

            <input type="password" class="toilet-login-input" id="passwordInput" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
            <button class="toilet-login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>

    <!-- Main App -->
    <div id="app" style="display:none;">
        <div class="photos-page">
            <header class="photos-header">
                <div class="photos-header-inner">
                    <div class="header-title-wrap">
                        <button type="button" class="back-btn" id="backBtn" aria-label="กลับ" hidden><i class="fas fa-arrow-left"></i></button>

                            <div class="header-stats" id="albumCountText" aria-live="polite">
                                <span class="sk-light" style="width:68px"></span><span class="sk-light" style="width:80px"></span><span class="sk-light" style="width:74px"></span>
                            </div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="photos-header-btn" type="button" id="trashBtn" title="ถังขยะ" aria-label="ถังขยะ"><i class="fas fa-trash-can"></i><span>ถังขยะ</span></button>
                        <button class="photos-header-btn" type="button" id="sharesBtn" title="ลิงก์ที่แชร์" aria-label="ลิงก์ที่แชร์"><i class="fas fa-link"></i><span>ลิงก์ที่แชร์</span></button>
                        <button class="photos-header-btn" type="button" id="createBtn" onclick="createAlbum()" aria-label="อัลบั้มใหม่"><i class="fas fa-folder-plus"></i><span>อัลบั้มใหม่</span></button>
                    </div>
                </div>
                <div class="photos-toolbar" id="albumToolbar">
                    <label class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="search" id="searchInput" placeholder="ค้นหาอัลบั้มทั้งหมด (รวมโฟลเดอร์ย่อย)..." autocomplete="off" enterkeyhint="search">
                        <button type="button" class="search-clear" id="searchClear" aria-label="ล้างคำค้นหา" hidden><i class="fas fa-xmark"></i></button>
                    </label>
                    <div class="filter-select-wrapper">
                        <i class="fa-solid fa-arrow-down-wide-short select-icon-left"></i>
                        <select id="sortSelect" aria-label="เรียงลำดับ">
                            <option value="default">ค่าเริ่มต้น</option>
                            <option value="updated_desc">แก้ไขล่าสุด</option>
                            <option value="updated_asc">แก้ไขเก่าสุด</option>
                            <option value="created_desc">สร้างล่าสุด</option>
                            <option value="created_asc">สร้างเก่าสุด</option>
                            <option value="count_desc">จำนวนรูปมากสุด</option>
                            <option value="count_asc">จำนวนรูปน้อยสุด</option>
                            <option value="name_asc">ชื่อ ก-ฮ</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon-right"></i>
                    </div>
                </div>
                <div class="photos-toolbar" id="photosToolbar" hidden>
                    <div class="filter-select-wrapper">
                        <i class="fa-regular fa-calendar select-icon-left"></i>

            <div class="photos-content">

                    <!-- Skeleton shown until cached or fresh data renders -->

                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                    <div class="photos-album-card sk-card" aria-hidden="true"><div class="photos-album-cover sk"></div><div class="photos-album-info"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div></div>
                </div>
                </div>
                <div id="photosPane" hidden>
                    <div id="tlGroups"></div>
                    <div class="tl-status" id="tlStatus"></div>
                    <div id="tlSentinel" style="height:1px"></div>
