<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- Clock face -->
  <circle cx="32" cy="32" r="16" fill="white" opacity="0.9"/>
  <!-- Hour marks -->
  <line x1="32" y1="18" x2="32" y2="21" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="32" y2="46" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="18" y1="32" x2="21" y2="32" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="43" y1="32" x2="46" y2="32" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Hour hand -->
  <line x1="32" y1="32" x2="32" y2="23" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="32" y1="32" x2="40" y2="28" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#d97706"/>
  <!-- Late indicator -->
  <circle cx="49" cy="14" r="8" fill="#ef4444"/>
  <path d="M49 10v5l3 2" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
