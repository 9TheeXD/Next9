services:
  postgres:
    image: postgres:16-alpine
    container_name: nextbreath-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: nextbreath
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev_changeme}
      POSTGRES_DB: nextbreath
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextbreath"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
